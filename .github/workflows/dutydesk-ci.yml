name: DutyDesk CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - marketplace-readiness

concurrency:
  group: dutydesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moodle-plugin-ci:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_401_STABLE
            php: '8.1'
            node: '16'
            db: mysqli
            dbname: moodle_401_mysql
            dbuser: root
            dbpass: ''
          - moodle: MOODLE_405_STABLE
            php: '8.3'
            node: '22'
            db: mysqli
            dbname: moodle_405_mysql
            dbuser: root
            dbpass: ''
          - moodle: MOODLE_401_STABLE
            php: '8.1'
            node: '16'
            db: pgsql
            dbname: moodle_401_pgsql
            dbuser: moodle
            dbpass: moodle
          - moodle: MOODLE_405_STABLE
            php: '8.3'
            node: '22'
            db: pgsql
            dbname: moodle_405_pgsql
            dbuser: moodle
            dbpass: moodle

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_NAME: ${{ matrix.dbname }}
      DB_USER: ${{ matrix.dbuser }}
      DB_PASS: ${{ matrix.dbpass }}
      MOODLE_BRANCH: ${{ matrix.moodle }}
      CI_DIR: ${{ runner.temp }}/moodle-plugin-ci
      MOODLE_DIR: ${{ github.workspace }}/moodle-ci
      PLUGIN_DIR: ${{ github.workspace }}
      INSTALLED_PLUGIN_DIR: ${{ github.workspace }}/moodle-ci/local/dutydesk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_AU.UTF-8

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >
            ctype, curl, dom, exif, fileinfo, gd, hash, iconv, intl, json,
            mbstring, mysqli, pgsql, openssl, pcre, simplexml, soap, sodium, spl,
            tokenizer, xml, xmlreader, zip, zlib
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Moodle Plugin CI
        run: composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci "$CI_DIR" ^4

      - name: Install Moodle test site
        run: >
          "$CI_DIR/bin/moodle-plugin-ci" install
          --moodle="$MOODLE_DIR"
          --plugin="$PLUGIN_DIR"
          --db-type="$DB"
          --db-host="$DB_HOST"
          --db-name="$DB_NAME"
          --db-user="$DB_USER"
          --db-pass="$DB_PASS"
          --branch="$MOODLE_BRANCH"
          --no-init

      - name: Initialise PHPUnit test site
        run: php "$MOODLE_DIR/admin/tool/phpunit/cli/init.php" --disable-composer

      - name: PHP lint
        run: "$CI_DIR/bin/moodle-plugin-ci" phplint "$INSTALLED_PLUGIN_DIR"

      - name: Plugin validation
        run: "$CI_DIR/bin/moodle-plugin-ci" validate "$INSTALLED_PLUGIN_DIR"

      - name: Upgrade savepoints
        run: "$CI_DIR/bin/moodle-plugin-ci" savepoints "$INSTALLED_PLUGIN_DIR"

      - name: Moodle codechecker
        run: "$CI_DIR/bin/moodle-plugin-ci" codechecker "$INSTALLED_PLUGIN_DIR"

      - name: Mustache lint
        run: "$CI_DIR/bin/moodle-plugin-ci" mustache "$INSTALLED_PLUGIN_DIR"

      - name: AMD lint and build check
        run: "$CI_DIR/bin/moodle-plugin-ci" grunt --moodle="$MOODLE_DIR" --tasks=amd "$INSTALLED_PLUGIN_DIR"

      - name: PHPUnit
        run: "$CI_DIR/bin/moodle-plugin-ci" phpunit --moodle="$MOODLE_DIR" "$INSTALLED_PLUGIN_DIR"
